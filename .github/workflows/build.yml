---
name: Build signed family Bazzite image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
      - "**/*.md"
  schedule:
    # Daily check at 12:15 UTC. It does not build when the release marker exists.
    - cron: "15 12 * * *"
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Check latest stable Bazzite release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
      release_id: ${{ steps.base.outputs.release_id }}
      bazzite_image: ${{ steps.base.outputs.bazzite_image }}
      image_name: ${{ steps.image.outputs.image_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install image inspection tool
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Read image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          source image-template.env
          image_name="${IMAGE_NAME,,}"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"

      - name: Inspect current Bazzite GNOME stable image
        id: base
        shell: bash
        run: |
          set -euo pipefail

          base_name="ghcr.io/ublue-os/bazzite-gnome"
          skopeo inspect "docker://${base_name}:stable" > /tmp/bazzite.json

          digest="$(jq -r .Digest /tmp/bazzite.json)"
          base_version="$(jq -r '.Labels["org.opencontainers.image.version"]' /tmp/bazzite.json)"

          if [[ -z "$digest" || "$digest" == null ]]; then
            echo "Bazzite stable digest is missing."
            exit 1
          fi

          if [[ -z "$base_version" || "$base_version" == null ]]; then
            echo "Bazzite stable version label is missing."
            exit 1
          fi

          # Bazzite's build process can expose a trailing .0 in the OCI label
          # while the stable GitHub release uses the shorter form.
          release_id="${base_version%.0}"
          bazzite_image="${base_name}@${digest}"

          echo "Bazzite stable version: ${base_version}"
          echo "Custom release marker: ${release_id}"
          echo "Pinned base image: ${bazzite_image}"

          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"
          echo "bazzite_image=${bazzite_image}" >> "$GITHUB_OUTPUT"

      - name: Resolve latest stable Bazzite GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          latest="$(gh api repos/ublue-os/bazzite/releases/latest --jq .tag_name)"
          latest="${latest#stable-}"
          latest="${latest%.0}"

          echo "Latest stable GitHub release: ${latest}"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"

      - name: Decide whether this run should build
        id: decision
        env:
          IMAGE_NAME: ${{ steps.image.outputs.image_name }}
          RELEASE_ID: ${{ steps.base.outputs.release_id }}
          LATEST_RELEASE: ${{ steps.release.outputs.latest }}
        shell: bash
        run: |
          set -euo pipefail

          # Pushes, pull requests and manually requested builds always use the
          # current digest behind Bazzite's stable tag.
          if [[ "${GITHUB_EVENT_NAME}" != "schedule" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A GitHub release can appear shortly before the stable image tag
          # finishes moving. Wait for both sources to agree.
          if [[ "$RELEASE_ID" != "$LATEST_RELEASE" ]]; then
            echo "GitHub release is ${LATEST_RELEASE}, but the stable GNOME image is ${RELEASE_ID}."
            echo "The next scheduled run will check again."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          marker_image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:upstream-${RELEASE_ID}"

          if docker manifest inspect "$marker_image" >/dev/null 2>&1; then
            echo "Release ${RELEASE_ID} was already built."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release ${RELEASE_ID} is new for this custom image."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build_push:
    name: Build, publish and sign
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      packages: write
      id-token: write

    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      BAZZITE_IMAGE: ${{ needs.prepare.outputs.bazzite_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install image inspection tool
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo


      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check Just syntax
        run: just check

      - name: Read default tag
        shell: bash
        run: |
          set -euo pipefail
          source image-template.env
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Build pinned Bazzite stable image
        shell: bash
        run: |
          set -euo pipefail

          sudo podman build \
            --pull=newer \
            --build-arg "BAZZITE_IMAGE=${BAZZITE_IMAGE}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.description=Personal Bazzite GNOME family image" \
            --label "org.opencontainers.image.version=${RELEASE_ID}" \
            --label "io.iegorch86.bazzite.release=${RELEASE_ID}" \
            --tag "${IMAGE_NAME}:${DEFAULT_TAG}" \
            --file Containerfile \
            .

      - name: Rechunk image for resumable updates
        shell: bash
        run: |
          sudo -E $(command -v just) ostree-rechunk \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}"

      - name: Generate image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::7}"
          build_date="$(date -u +%Y%m%d)"

          tags=(
            "${DEFAULT_TAG}"
            "upstream-${RELEASE_ID}"
            "${DEFAULT_TAG}-${build_date}"
            "${DEFAULT_TAG}-${short_sha}"
            "${DEFAULT_TAG}-${build_date}-${short_sha}"
          )

          printf '%s\n' "${tags[@]}" | sort -u > /tmp/image-tags
          echo "Tags:"
          cat /tmp/image-tags

      - name: Apply image tags
        shell: bash
        run: |
          set -euo pipefail
          image_id="$(sudo podman inspect "${IMAGE_NAME}:${DEFAULT_TAG}" --format '{{.Id}}')"

          while IFS= read -r tag; do
            sudo podman tag "$image_id" "${IMAGE_NAME}:${tag}"
          done < /tmp/image-tags

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push all tags to GHCR
        id: push
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        run: |
          set -euo pipefail

          authfile="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          test -r "$authfile"

          while IFS= read -r tag; do
            delay=60

            for attempt in 1 2 3 4; do
              if sudo podman push \
                --authfile "$authfile" \
                "${IMAGE_NAME}:${tag}" \
                "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"; then
                break
              fi

              if [[ "$attempt" -eq 4 ]]; then
                echo "Failed to push ${tag} after ${attempt} attempts."
                exit 1
              fi

              echo "Push of ${tag} failed. Waiting ${delay}s before retry..."
              sleep "$delay"
              delay=$((delay * 2))
            done
          done < /tmp/image-tags

          digest="$(
            skopeo inspect \
              --format '{{.Digest}}' \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          )"

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid published digest: $digest"
            exit 1
          fi

          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Published registry digest: ${digest}"

      - name: Install Cosign
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Sign published image digest
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Verify published image signature
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

          cosign verify \
            --new-bundle-format=false \
            --key cosign.pub \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          release_tag="stable-${RELEASE_ID}"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "GitHub Release ${release_tag} already exists."
            exit 0
          fi

          current_packages="/tmp/family-packages.json"
          previous_packages="/tmp/previous-family-packages.json"
          package_rows="/tmp/family-package-rows.md"
          package_notes="/tmp/family-package-notes.md"

          echo '{}' > "$current_packages"

          while IFS= read -r package; do
            [[ -z "$package" || "$package" == \#* ]] && continue

            version="$(
              sudo podman run --rm \
                --entrypoint /usr/bin/rpm \
                "${IMAGE_NAME}:${DEFAULT_TAG}" \
                -q --qf '%{VERSION}-%{RELEASE}' "$package" \
                2>/dev/null || true
            )"

            if [[ -z "$version" ]]; then
              echo "Tracked package not installed: ${package}"
              continue
            fi

            jq \
              --arg package "$package" \
              --arg version "$version" \
              '. + {($package): $version}' \
              "$current_packages" > "${current_packages}.new"
            mv "${current_packages}.new" "$current_packages"
          done < build_files/release-packages.txt

          previous_release_tag="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/latest" \
              --jq .tag_name 2>/dev/null || true
          )"

          have_previous=false
          if [[ -n "$previous_release_tag" ]]; then
            mkdir -p /tmp/previous-family-release
            if gh release download "$previous_release_tag" \
              --pattern family-packages.json \
              --dir /tmp/previous-family-release >/dev/null 2>&1; then
              cp /tmp/previous-family-release/family-packages.json "$previous_packages"
              have_previous=true
            fi
          fi

          if [[ "$have_previous" == true ]]; then
            : > "$package_rows"
            changes=0

            while IFS= read -r package; do
              [[ -z "$package" || "$package" == \#* ]] && continue

              previous="$(jq -r --arg package "$package" '.[$package] // empty' "$previous_packages")"
              current="$(jq -r --arg package "$package" '.[$package] // empty' "$current_packages")"

              [[ "$previous" == "$current" ]] && continue

              if [[ -z "$previous" && -n "$current" ]]; then
                printf '| ✨ | `%s` |  | `%s` |\n' "$package" "$current" >> "$package_rows"
              elif [[ -n "$previous" && -z "$current" ]]; then
                printf '| ❌ | `%s` | `%s` |  |\n' "$package" "$previous" >> "$package_rows"
              else
                printf '| 🔄 | `%s` | `%s` | `%s` |\n' "$package" "$previous" "$current" >> "$package_rows"
              fi

              changes=$((changes + 1))
            done < build_files/release-packages.txt

            {
              echo '### Family-layer package changes'
              echo
              if [[ "$changes" -eq 0 ]]; then
                echo 'No tracked Family-layer package versions changed since the previous Family Bazzite release.'
              else
                echo '| | Package | Previous | New |'
                echo '| --- | --- | --- | --- |'
                cat "$package_rows"
              fi
            } > "$package_notes"
          else
            {
              echo '### Family-layer package versions'
              echo
              echo 'Initial package-version baseline for automated Family Bazzite changelogs.'
              echo
              echo '| Package | Version |'
              echo '| --- | --- |'

              while IFS= read -r package; do
                [[ -z "$package" || "$package" == \#* ]] && continue
                version="$(jq -r --arg package "$package" '.[$package] // empty' "$current_packages")"
                [[ -z "$version" ]] && continue
                printf '| `%s` | `%s` |\n' "$package" "$version"
              done < build_files/release-packages.txt
            } > "$package_notes"
          fi

          gh api "repos/ublue-os/bazzite/releases/tags/${RELEASE_ID}" \
            --jq .body > /tmp/upstream-release.md

          awk '/^### How to rebase$/ { exit } { print }' \
            /tmp/upstream-release.md > /tmp/upstream-changelog.md

          {
            cat <<EOF
          ## Family Bazzite ${RELEASE_ID}

          Custom Bazzite GNOME image based on the upstream stable Bazzite ${RELEASE_ID} release.

          EOF
            cat "$package_notes"
            cat <<EOF

          ### Container images

          Current stable image:

          \`\`\`text
          ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:stable
          \`\`\`

          Release-specific image:

          \`\`\`text
          ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:upstream-${RELEASE_ID}
          \`\`\`

          Published digest:

          \`\`\`text
          ${DIGEST}
          \`\`\`

          ---

          ## Upstream Bazzite ${RELEASE_ID} changelog

          EOF
            cat /tmp/upstream-changelog.md
            cat <<EOF

          > Upstream changelog imported automatically from the corresponding Universal Blue Bazzite release:
          > https://github.com/ublue-os/bazzite/releases/tag/${RELEASE_ID}
          EOF
          } > /tmp/release-notes.md

          gh release create "$release_tag" \
            /tmp/family-packages.json \
            --target "$GITHUB_SHA" \
            --title "${RELEASE_ID}: Family Bazzite Stable" \
            --notes-file /tmp/release-notes.md \
            --latest
